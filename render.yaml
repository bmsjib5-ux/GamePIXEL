# Render Blueprint: the game (static site), its online server, and the server's database.
# In Render: New -> Blueprint -> pick this repository. After the first deploy, put the
# server's address into game/js/online.js (API_URL) if Render gave it a different name.
services:
  - type: web
    name: pro-monter
    runtime: static
    buildCommand: ""
    staticPublishPath: ./game
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache

  - type: web
    name: pro-monter-api
    runtime: node
    plan: free
    region: singapore          # closest to players in Thailand
    # built from the repository root: live battles read the game's rules from game/js/data.js
    buildCommand: cd server && npm install
    startCommand: node server/index.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pro-monter-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "*"
      # idea requests ("คำขอพัฒนาเกม"): Render asks for these on the first Blueprint deploy
      - key: ANTHROPIC_API_KEY         # the AI that checks each idea; without it every idea waits for the owner
        sync: false
      - key: ADMIN_USERS               # the game owner's username(s), comma-separated: they allow or turn down ideas
        sync: false
      - key: IDEAS_EXPORT_KEY          # optional secret for /api/ideas/queue.json?key=... (the development queue)
        sync: false

databases:
  - name: pro-monter-db
    plan: free
    region: singapore          # same region as the API, so they talk over Render's private network
