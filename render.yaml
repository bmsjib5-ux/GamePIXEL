# Render Blueprint: the game (static site), its online server, and the server's database.
# In Render: New -> Blueprint -> pick this repository. After the first deploy, put the
# server's address into game/js/online.js (API_URL) if Render gave it a different name.
services:
  - type: web
    name: pro-monter
    runtime: static
    buildCommand: ""
    staticPublishPath: ./game
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache

  - type: web
    name: pro-monter-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pro-monter-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "*"

databases:
  - name: pro-monter-db
    plan: free
