<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#16161d">
<meta name="apple-mobile-web-app-title" content="มอนสเตอร์ต้นกล้า">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>นักสะสมมอนสเตอร์ หมู่บ้านต้นกล้า</title>
<style>
  html, body { margin: 0; height: 100%; background: #16161d; overflow: hidden; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
         font-family: "Leelawadee UI", "Noto Sans Thai", Tahoma, sans-serif;
         touch-action: none; -webkit-user-select: none; user-select: none;
         -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { image-rendering: pixelated; background: #000; display: block; touch-action: none; }
  #hint { color: #9a9aa8; font-size: 13px; margin-top: 8px; text-align: center; }
  #hint b { color: #d8d8e4; font-weight: 600; }
  #hint:empty { display: none; }

  /* on-screen buttons: only while playing by touch */
  #touch { display: none; }
  body.touch #touch { display: block; }
  body.touch #hint { display: none; }
  /* upright phone: the picture fills the screen and the buttons float over its lower part */
  body.fullview canvas { position: fixed; left: 0; top: 0; }
  /* over the bright map the buttons need a darker backing to stay readable */
  body.fullview #dpad { background: rgba(20, 24, 34, 0.42); border-color: rgba(255, 255, 255, 0.55); }
  body.fullview #btns button, body.fullview #btnFull { border-color: rgba(255, 255, 255, 0.6);
          text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7); }
  body.fullview #btnA { background: rgba(196, 62, 34, 0.72); }
  body.fullview #btnB { background: rgba(34, 104, 190, 0.70); }
  body.fullview #btnFull { background: rgba(20, 24, 34, 0.45); }
  @media (orientation: portrait) {
    body.touch { justify-content: flex-start; }
  }
  #dpad, #btns, #btnFull { position: fixed; z-index: 5; touch-action: none; }
  #dpad { left: calc(14px + env(safe-area-inset-left, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px));
          width: 148px; height: 148px; border-radius: 50%;
          background: rgba(255, 255, 255, 0.10); border: 2px solid rgba(255, 255, 255, 0.28); }
  #dpad i { position: absolute; width: 0; height: 0; border: 13px solid transparent; opacity: 0.75; }
  #dpad .up    { left: 50%; top: 14px;    margin-left: -13px; border-bottom-color: #fff; border-top-width: 0; }
  #dpad .down  { left: 50%; bottom: 14px; margin-left: -13px; border-top-color: #fff; border-bottom-width: 0; }
  #dpad .left  { top: 50%; left: 14px;    margin-top: -13px; border-right-color: #fff; border-left-width: 0; }
  #dpad .right { top: 50%; right: 14px;   margin-top: -13px; border-left-color: #fff; border-right-width: 0; }
  #dpad[data-dir="up"] .up       { border-bottom-color: #ffd866; opacity: 1; }
  #dpad[data-dir="down"] .down   { border-top-color: #ffd866; opacity: 1; }
  #dpad[data-dir="left"] .left   { border-right-color: #ffd866; opacity: 1; }
  #dpad[data-dir="right"] .right { border-left-color: #ffd866; opacity: 1; }
  #btns { right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px));
          width: 150px; height: 148px; }
  #btns button, #btnFull { font: inherit; color: #fff; border: 2px solid rgba(255, 255, 255, 0.35);
          background: rgba(255, 255, 255, 0.12); border-radius: 50%; padding: 0; touch-action: none; }
  #btns button { position: absolute; width: 70px; height: 70px; font-size: 24px; font-weight: 700; }
  #btnA { right: 0; top: 14px; background: rgba(224, 86, 47, 0.45); }
  #btnB { left: 0; bottom: 0; background: rgba(47, 134, 224, 0.40); }
  #btns button.down { background: rgba(255, 216, 102, 0.75); color: #2b2420; }
  #authBox, #nameBox { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
             background: rgba(10, 12, 18, 0.6); }
  #authBox[hidden], #nameBox[hidden] { display: none; }
  #authBox form, #nameBox form { width: min(340px, calc(100vw - 32px)); background: #fbf6e6; color: #2b2420; border-radius: 10px;
                  border: 3px solid #5a5048; padding: 16px 18px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
                  font: 15px "Leelawadee UI", "Noto Sans Thai", Tahoma, sans-serif; }
  #authBox h2, #nameBox h2 { font-size: 17px; margin: 0 0 12px; }
  #authBox label { display: block; margin: 8px 0; font-size: 14px; }
  #authBox input, #nameBox input { display: block; width: 100%; box-sizing: border-box; margin-top: 4px; padding: 8px 10px;
                   font: inherit; font-size: 16px; border: 2px solid #b8ab8c; border-radius: 6px; background: #fff; }
  #nameBox .hint { font-size: 12px; color: #8a8478; margin: 6px 0 10px; }
  #authBox input:focus, #nameBox input:focus { outline: none; border-color: #e0782f; }
  #authNote { min-height: 20px; margin: 8px 0; font-size: 13px; }
  #authBox .row, #nameBox .row { display: flex; gap: 8px; flex-wrap: wrap; }
  #authBox button, #nameBox button { flex: 1; padding: 9px 6px; font: inherit; font-size: 14px; font-weight: 600; border-radius: 6px;
                    border: 2px solid #8a5a2a; background: #e0782f; color: #fff; cursor: pointer; }
  #authBox button.ghost, #nameBox button.ghost { background: transparent; color: #5a5048; border-color: #b8ab8c; }
  #authBox button:disabled { opacity: 0.6; cursor: wait; }
  #btnSound { position: fixed; z-index: 6; top: calc(8px + env(safe-area-inset-top, 0px));
              left: calc(8px + env(safe-area-inset-left, 0px)); width: 38px; height: 38px; padding: 0;
              font-size: 18px; border-radius: 8px; color: #fff; cursor: pointer;
              background: rgba(20, 24, 34, 0.55); border: 2px solid rgba(255, 255, 255, 0.35); touch-action: manipulation; }
  #btnBot { position: fixed; z-index: 6; top: calc(8px + env(safe-area-inset-top, 0px));
            left: calc(54px + env(safe-area-inset-left, 0px)); padding: 6px 10px; border-radius: 8px;
            font: 600 13px "Leelawadee UI", "Noto Sans Thai", Tahoma, sans-serif; color: #fff;
            background: rgba(20, 24, 34, 0.55); border: 2px solid rgba(255, 255, 255, 0.35);
            touch-action: manipulation; cursor: pointer; }
  #btnBot[hidden], #btnInstall[hidden] { display: none; }
  #btnInstall { position: fixed; z-index: 6; top: calc(8px + env(safe-area-inset-top, 0px));
               left: 50%; transform: translateX(-50%); padding: 7px 14px; border-radius: 8px;
               font: 600 14px "Leelawadee UI", "Noto Sans Thai", Tahoma, sans-serif; color: #2b2420;
               background: #ffd866; border: 2px solid #fff3c4; cursor: pointer;
               box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4); }
  #btnInstall:hover { background: #ffe58f; }
  #btnBot.on { background: rgba(214, 120, 28, 0.85); border-color: #ffd866; }
  #btnFull { top: calc(8px + env(safe-area-inset-top, 0px)); right: calc(8px + env(safe-area-inset-right, 0px));
             width: 38px; height: 38px; font-size: 17px; border-radius: 8px; }
</style>
</head>
<body>
<canvas id="game" width="960" height="640"></canvas>
<div id="hint"></div>
<div id="touch">
  <div id="dpad" aria-label="ปุ่มทิศทาง"><i class="up"></i><i class="down"></i><i class="left"></i><i class="right"></i></div>
  <div id="btns">
    <button id="btnB" type="button" aria-label="ยกเลิกหรือเปิดเมนู">B</button>
    <button id="btnA" type="button" aria-label="ตกลง">A</button>
  </div>
  <button id="btnFull" type="button" aria-label="เต็มจอ">⛶</button>
</div>
<!-- login form for the online features (shown by js/online.js) -->
<div id="authBox" hidden>
  <form onsubmit="return false">
    <h2>เข้าสู่ระบบ / สมัครสมาชิก</h2>
    <label>ชื่อผู้ใช้ <input id="authUser" autocomplete="username" maxlength="16" placeholder="3-16 ตัวอักษร"></label>
    <label>รหัสผ่าน <input id="authPass" type="password" autocomplete="current-password" maxlength="100" placeholder="อย่างน้อย 6 ตัว"></label>
    <p id="authNote"></p>
    <div class="row">
      <button id="authLogin" type="button">เข้าสู่ระบบ</button>
      <button id="authRegister" type="button">สมัครใหม่</button>
      <button id="authCancel" type="button" class="ghost">ยกเลิก</button>
    </div>
  </form>
</div>
<!-- typing the hero's name (shown by askText in js/game.js) -->
<div id="nameBox" hidden>
  <form onsubmit="return false">
    <h2 id="nameTitle">ชื่อของคุณคืออะไร?</h2>
    <input id="nameInput" maxlength="12" autocomplete="off" placeholder="1-12 ตัวอักษร">
    <p class="hint" id="nameHint">เว้นว่างไว้ = ต้นกล้า</p>
    <div class="row">
      <button id="nameOk" type="button">ตกลง</button>
      <button id="nameCancel" type="button" class="ghost">ยกเลิก</button>
    </div>
  </form>
</div>
<!-- sound on / off (key M) -->
<button id="btnSound" type="button" aria-label="เปิดหรือปิดเสียง">🔊</button>
<!-- install the game as an app: shown on Windows when Edge / Chrome offers it -->
<button id="btnInstall" type="button" hidden aria-label="ติดตั้งเกม" title="ติดตั้งเกมลงในเครื่อง">⬇ ติดตั้งเกม</button>
<!-- auto-play bot for testing: off -> x1 -> x4 (key P) -->
<button id="btnBot" type="button" hidden aria-label="บอทเล่นอัตโนมัติ" title="บอทเล่นอัตโนมัติ (ปุ่ม P)">บอท</button>
<!-- raise ?v= whenever these files change, so browsers do not keep an old copy -->
<script src="js/tiles.js?v=42"></script>
<script src="js/data.js?v=42"></script>
<script src="js/map.js?v=42"></script>
<script src="js/audio.js?v=42"></script>
<script src="js/online.js?v=42"></script>
<script src="js/game.js?v=42"></script>
</body>
</html>
